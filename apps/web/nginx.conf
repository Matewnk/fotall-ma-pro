server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA : toute route inconnue de nginx (ex. /commandes) doit retomber sur
  # index.html pour laisser react-router-dom la resoudre cote client.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
