<!doctype html>

<html class="light" lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Nouvelle Commande - Fotall-Ma PRO</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'tenant-accent': 'var(--primary-color)',
              'inverse-surface': '#2e3037',
              primary: '#003c90',
              'inverse-on-surface': '#f0f0f9',
              'on-background': '#191b22',
              'secondary-fixed-dim': '#b7c8e1',
              'alert-critical': '#EF4444',
              error: '#ba1a1a',
              'surface-container-low': '#f3f3fc',
              'primary-fixed-dim': '#b0c6ff',
              'on-primary-container': '#bcceff',
              'status-progress': '#3B82F6',
              'tertiary-container': '#993900',
              'on-primary-fixed-variant': '#00419c',
              'surface-container-lowest': '#ffffff',
              'on-tertiary-container': '#ffc0a7',
              'outline-variant': '#c3c6d5',
              'tertiary-fixed': '#ffdbcd',
              'on-tertiary': '#ffffff',
              'on-surface-variant': '#434653',
              outline: '#737784',
              'surface-bright': '#faf8ff',
              background: '#faf8ff',
              'on-secondary': '#ffffff',
              tertiary: '#732900',
              'tertiary-fixed-dim': '#ffb596',
              'error-container': '#ffdad6',
              'surface-container-high': '#e7e7f1',
              'on-secondary-fixed': '#0b1c30',
              'on-error': '#ffffff',
              'secondary-container': '#d0e1fb',
              'primary-container': '#0f52ba',
              'surface-container': '#ededf6',
              'surface-ticket': '#F8FAFC',
              'primary-fixed': '#d9e2ff',
              'surface-variant': '#e1e2eb',
              'on-primary': '#ffffff',
              'status-pending': '#F59E0B',
              surface: '#faf8ff',
              'surface-tint': '#1d59c1',
              'secondary-fixed': '#d3e4fe',
              'surface-container-highest': '#e1e2eb',
              'status-ready': '#10B981',
              'inverse-primary': '#b0c6ff',
              secondary: '#505f76',
              'on-tertiary-fixed-variant': '#7d2d00',
              'on-tertiary-fixed': '#360f00',
              'on-secondary-fixed-variant': '#38485d',
              'on-secondary-container': '#54647a',
              'on-surface': '#191b22',
              'status-delivered': '#6366F1',
              'surface-dim': '#d9d9e2',
              'on-error-container': '#93000a',
              'on-primary-fixed': '#001945',
            },
            borderRadius: {
              DEFAULT: '0.125rem',
              lg: '0.25rem',
              xl: '0.5rem',
              full: '0.75rem',
            },
            spacing: {
              gutter: '16px',
              'margin-mobile': '16px',
              base: '8px',
              'margin-desktop': '24px',
              'container-max': '1440px',
            },
            fontFamily: {
              'kpi-display': ['Inter'],
              'data-mono': ['JetBrains Mono'],
              'body-md': ['Inter'],
              'label-caps': ['Inter'],
              'headline-md': ['Inter'],
              'headline-lg-mobile': ['Inter'],
              'ticket-body': ['Inter'],
              'headline-lg': ['Inter'],
            },
            fontSize: {
              'kpi-display': [
                '48px',
                { lineHeight: '56px', letterSpacing: '-0.02em', fontWeight: '700' },
              ],
              'data-mono': ['14px', { lineHeight: '20px', fontWeight: '500' }],
              'body-md': ['16px', { lineHeight: '24px', fontWeight: '400' }],
              'label-caps': [
                '12px',
                { lineHeight: '16px', letterSpacing: '0.05em', fontWeight: '700' },
              ],
              'headline-md': ['24px', { lineHeight: '32px', fontWeight: '600' }],
              'headline-lg-mobile': ['24px', { lineHeight: '30px', fontWeight: '600' }],
              'ticket-body': ['14px', { lineHeight: '18px', fontWeight: '500' }],
              'headline-lg': ['30px', { lineHeight: '38px', fontWeight: '600' }],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
      .material-symbols-outlined[data-weight='fill'] {
        font-variation-settings:
          'FILL' 1,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
    </style>
  </head>
  <body
    class="bg-background text-on-background font-body-md min-h-screen flex flex-col relative pb-32"
  >
    <!-- Top Navigation (Transactional intent, suppressed standard shell, simplified header) -->
    <header
      class="bg-surface border-b border-outline-variant sticky top-0 z-40 flex items-center justify-between px-margin-mobile h-16"
    >
      <div class="flex items-center gap-2">
        <button
          aria-label="Retour"
          class="p-2 -ml-2 rounded-full text-on-surface hover:bg-surface-container"
        >
          <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">
          Nouvelle Commande
        </h1>
      </div>
      <button
        aria-label="Scanner code barre"
        class="p-2 -mr-2 rounded-full text-primary hover:bg-primary-container/20"
      >
        <span class="material-symbols-outlined">barcode_scanner</span>
      </button>
    </header>
    <main class="flex-1 px-margin-mobile py-gutter space-y-6">
      <!-- Client Selection -->
      <section
        class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 shadow-sm"
      >
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-headline-md text-body-md font-bold text-on-surface">Client</h2>
          <button
            class="text-primary font-label-caps text-label-caps hover:underline flex items-center gap-1"
          >
            <span class="material-symbols-outlined text-base">person_add</span>
            Nouveau Client
          </button>
        </div>
        <div class="relative">
          <span
            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant"
            >search</span
          >
          <input
            class="w-full bg-surface-container pl-10 pr-4 py-3 rounded-lg border-none focus:ring-2 focus:ring-primary text-on-surface font-body-md"
            placeholder="Rechercher un client..."
            type="text"
            value="Jean Dupont"
          />
          <button
            class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary"
          >
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <!-- Selected Client Info -->
        <div
          class="mt-4 flex items-center gap-3 p-3 bg-surface-container-low rounded-lg border border-outline-variant"
        >
          <div
            class="w-10 h-10 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center font-bold"
          >
            JD
          </div>
          <div class="flex-1">
            <p class="font-body-md text-on-surface font-semibold">Jean Dupont</p>
            <p class="font-data-mono text-data-mono text-on-surface-variant">+221 77 123 45 67</p>
          </div>
          <div
            class="px-2 py-1 bg-status-ready/10 text-status-ready rounded-full font-label-caps text-label-caps flex items-center gap-1"
          >
            <span class="material-symbols-outlined text-[14px]">star</span>
            Fidèle
          </div>
        </div>
      </section>
      <!-- Order Items Basket -->
      <section class="space-y-3">
        <div class="flex justify-between items-end mb-2">
          <h2 class="font-headline-md text-body-md font-bold text-on-surface">Prestations</h2>
          <button
            class="text-primary font-label-caps text-label-caps flex items-center gap-1 hover:bg-surface-container p-1.5 rounded"
          >
            <span class="material-symbols-outlined text-base">add_circle</span>
            Ajouter Article
          </button>
        </div>
        <!-- Item 1 -->
        <div
          class="bg-surface-container-lowest border border-outline-variant rounded-xl p-3 flex items-center gap-3 shadow-sm"
        >
          <div
            class="w-12 h-12 bg-surface-container rounded-lg flex items-center justify-center text-on-surface-variant"
          >
            <span class="material-symbols-outlined" data-weight="fill">apparel</span>
          </div>
          <div class="flex-1">
            <p class="font-body-md text-on-surface font-semibold">Chemise</p>
            <p class="font-ticket-body text-ticket-body text-on-surface-variant">Lavage à sec</p>
          </div>
          <div class="flex flex-col items-end gap-2">
            <p class="font-data-mono text-data-mono text-on-surface font-bold">3 000 FCFA</p>
            <div
              class="flex items-center gap-3 bg-surface-container-low rounded-full px-2 py-1 border border-outline-variant"
            >
              <button class="text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined text-sm">remove</span>
              </button>
              <span class="font-data-mono text-data-mono font-bold">2</span>
              <button class="text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined text-sm">add</span>
              </button>
            </div>
          </div>
        </div>
        <!-- Item 2 -->
        <div
          class="bg-surface-container-lowest border border-outline-variant rounded-xl p-3 flex items-center gap-3 shadow-sm"
        >
          <div
            class="w-12 h-12 bg-surface-container rounded-lg flex items-center justify-center text-on-surface-variant"
          >
            <span class="material-symbols-outlined" data-weight="fill">styler</span>
          </div>
          <div class="flex-1">
            <p class="font-body-md text-on-surface font-semibold">Pantalon</p>
            <p class="font-ticket-body text-ticket-body text-on-surface-variant">Repassage seul</p>
          </div>
          <div class="flex flex-col items-end gap-2">
            <p class="font-data-mono text-data-mono text-on-surface font-bold">2 000 FCFA</p>
            <div
              class="flex items-center gap-3 bg-surface-container-low rounded-full px-2 py-1 border border-outline-variant"
            >
              <button class="text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined text-sm">remove</span>
              </button>
              <span class="font-data-mono text-data-mono font-bold">1</span>
              <button class="text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined text-sm">add</span>
              </button>
            </div>
          </div>
        </div>
        <!-- Item 3 -->
        <div
          class="bg-surface-container-lowest border border-outline-variant rounded-xl p-3 flex items-center gap-3 shadow-sm"
        >
          <div
            class="w-12 h-12 bg-surface-container rounded-lg flex items-center justify-center text-on-surface-variant"
          >
            <span class="material-symbols-outlined" data-weight="fill">laundry</span>
          </div>
          <div class="flex-1">
            <p class="font-body-md text-on-surface font-semibold">Costume</p>
            <p class="font-ticket-body text-ticket-body text-on-surface-variant">
              Nettoyage complet
            </p>
          </div>
          <div class="flex flex-col items-end gap-2">
            <p class="font-data-mono text-data-mono text-on-surface font-bold">5 000 FCFA</p>
            <div
              class="flex items-center gap-3 bg-surface-container-low rounded-full px-2 py-1 border border-outline-variant"
            >
              <button class="text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined text-sm">remove</span>
              </button>
              <span class="font-data-mono text-data-mono font-bold">1</span>
              <button class="text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined text-sm">add</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <!-- Sticky Bottom Checkout Bar (Level 2 Elevation) -->
    <div
      class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant p-4 z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.1)]"
    >
      <div class="flex justify-between items-center mb-4">
        <span class="font-label-caps text-label-caps text-on-surface-variant"
          >TOTAL À ENCAISSER</span
        >
        <span class="font-kpi-display text-[24px] leading-8 font-bold text-primary"
          >10 000 FCFA</span
        >
      </div>
      <button
        class="w-full bg-primary text-on-primary font-headline-md text-body-md font-bold py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-primary-fixed-variant transition-colors shadow-sm"
      >
        VALIDER LA COMMANDE
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </div>
  </body>
</html>
