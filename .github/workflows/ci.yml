name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fotall
          POSTGRES_PASSWORD: fotall
          POSTGRES_DB: fotall_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fotall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fotall:fotall@localhost:5432/fotall_test
      JWT_SECRET: ci-integration-test-secret
      FACTURATION_WEBHOOK_SECRET: ci-integration-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @fotall/api run db:migrate:deploy
      - run: pnpm --filter @fotall/api run test:integration
