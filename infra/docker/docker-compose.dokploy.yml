# Variante du docker-compose.prod.yml pour un deploiement via Dokploy :
# aucun service Caddy ni port 80/443 publie ici — Dokploy fait tourner
# son propre reverse proxy (Traefik) qui occupe deja ces ports sur le
# VPS. Les domaines/HTTPS pour "api" et "web" se configurent dans
# l'onglet "Domains" du projet Dokploy (Host + nom du service + port
# interne + Let's Encrypt), pas dans ce fichier.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    expose:
      - '3000'
    depends_on: [postgres, redis]
    # Disque durable pour les sauvegardes quotidiennes (BackupScheduler)
    # — voir docs/production-checklist.md.
    volumes:
      - backups:/data/backups
    networks: [internal]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    expose:
      - '80'
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  backups:
